[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobile-auto"
version = "0.1.0"
description = "Android 移动能力包:原生与图像定位驱动、失败证据与本机网页调试服务"
requires-python = ">=3.12"
dependencies = [
    "uiautomator2>=3.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
image = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]
viewer = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "build>=1.2",
    "ruff>=0.4",
]

[project.scripts]
mobile-auto = "mobile_auto.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mobile_auto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "device: 需要真机与测试配置的测试(无设备不运行、不计为通过)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
