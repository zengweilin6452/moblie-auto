function chartMarkup(t,key){const m=metricForRun(t,key);if(m.median===null)return `<div class="empty" style="min-height:260px;display:grid;place-content:center">${icon('pulse')}<strong>当前设备不支持 GPU 占用采集</strong>保留缺失原因，不以 0 代替未采集值。</div>`;const left=45,right=680,top=18,bottom=200,scale=v=>bottom-(v-m.min)/(m.max-m.min)*(bottom-top),n=t.status==='not_tested'||sampleMode==='low'?6:31,amp=key==='memory'?26:key==='cpu'?8:3;const points=Array.from({length:n},(_,i)=>[left+i*(right-left)/(n-1),scale(m.median+Math.sin(i*1.35)*amp+Math.cos(i*.7)*amp*.25)]);const poly=points.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');const base=Array.from({length:31},(_,i)=>[left+i*(right-left)/30,scale(m.baseline+Math.sin(i*.8)*amp*.28)]).map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');return `<div class="chart"><svg viewBox="0 0 700 240" role="img" aria-label="${m.name}演示趋势图，归档窗口 ${t.duration} 秒"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${m.color}" stop-opacity=".13"/><stop offset="100%" stop-color="${m.color}" stop-opacity=".01"/></linearGradient></defs>${Array.from({length:5},(_,i)=>{const y=top+i*(bottom-top)/4,value=m.max-i*(m.max-m.min)/4;return `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#e9edf4" stroke-dasharray="3 4"/><text x="30" y="${y+4}" text-anchor="end">${Math.round(value)}</text>`}).join('')}<polygon points="${left},${bottom} ${poly} ${right},${bottom}" fill="url(#chart-fill)"/>${baselineProfile==='same'?`<polyline points="${base}" fill="none" stroke="#9cb4a9" stroke-width="2" stroke-dasharray="5 4"/>`:''}<polyline points="${poly}" fill="none" stroke="${m.color}" stroke-width="2.5" stroke-linejoin="round"/>${Array.from({length:7},(_,i)=>`<text x="${left+i*(right-left)/6}" y="224" text-anchor="middle">${Math.round((t.duration||180)*i/6)}s</text>`).join('')}<text x="${left}" y="11">${m.unit}</text></svg></div>`}

}
function newTask(module='ui',suite='核心链路回归'){wizard={step:1,module,name:module==='perf'?'APP 性能采集':module==='joint'?'UI 与性能联动验证':'APP UI 回归测试',pkg:'com.example.xinghe',build:'3.8.0-rc.2',suite:module==='perf'?'首页滑动场景':suite,device:devices.find(d=>deviceState(d)==='idle')?.id||'d2',duration:180,items:['CPU','Memory','FPS']};wizardRender()}
function readDraft(){if(!wizard)return;for(const key of ['name','pkg','build','suite','duration']){const el=$('#w-'+key);if(el)wizard[key]=el.value}const checked=$('input[name="w-device"]:checked');if(checked)wizard.device=checked.value;if($('#w-items'))wizard.items=$$('input[name="w-item"]:checked').map(e=>e.value)}
function wizardRender(){const w=wizard;const isPerf=w.module!=='ui';let body='';
 if(w.step===1)body=`<div class="module-options">${[['ui','phone','UI 自动化','执行 pytest 套件'],['perf','pulse','性能测试','采集指标与门禁'],['joint','layers','UI + 性能','联动设计 / 待接入']].map(([id,ic,title,desc])=>`<button class="module-option ${w.module===id?'active':''}" data-action="wizard-module" data-value="${id}" aria-pressed="${w.module===id}">${icon(ic)}<strong>${title}</strong><p>${desc}</p></button>`).join('')}</div><div class="form-grid"><label class="field full"><span>任务名称 *</span><input id="w-name" value="${esc(w.name)}" maxlength="60" placeholder="给本次测试起一个名字" required></label><label class="field"><span>应用包名 *</span><input id="w-pkg" value="${esc(w.pkg)}" maxlength="120" required></label><label class="field"><span>应用版本 *</span><input id="w-build" value="${esc(w.build)}" maxlength="40" required></label><label class="field full"><span>${w.module==='perf'?'测试场景':'测试套件'}</span><select id="w-suite">${(w.module==='perf'?['首页滑动场景','商品详情','搜索场景']:suites.map(s=>s.name)).map(name=>`<option ${name===w.suite?'selected':''}>${name}</option>`).join('')}</select><small>示例目录；实际用例与应用版本需要宿主同步。</small></label></div>${w.module==='joint'?'<div class="notice mt">本流程演示联动任务配置；真实运行需要宿主注入设备准入协议并实现步骤打标。</div>':''}`;
 if(w.step===2)body=`<h3>选择执行设备</h3><p class="small muted" style="margin:5px 0 13px">可选择占用中的设备排队；离线或未授权设备不可选。</p>${devices.map(d=>{const s=deviceState(d),disabled=['offline','unauthorized'].includes(s);return `<label class="device-choice"><input type="radio" name="w-device" value="${d.id}" ${w.device===d.id?'checked':''} ${disabled?'disabled':''}><span class="grow"><strong>${d.name}</strong><span class="muted small"> / ${d.os}</span></span>${badge(s)}</label>`}).join('')}${isPerf?`<div class="form-grid mt"><label class="field"><span>采集时长（秒）*</span><input id="w-duration" type="number" min="10" max="3600" step="1" value="${w.duration}" required><small>演示范围 10–3600 秒；实际采样率由设备决定。</small></label><div class="field"><span>基线与门禁</span><div class="summary-block" style="padding:8px 10px;margin:0;font-size:11px">同档案稳定版 / 标准门禁<br><span class="muted">PSS &lt; 240 / CPU &lt; 35 / FPS ≥ 50</span></div></div></div><div class="field mt" id="w-items"><span>采集指标（CPU / 内存 / FPS 为标准门禁必选）</span><div class="check-list">${['CPU','Memory','FPS','Network','Battery'].map(item=>`<label><input type="checkbox" name="w-item" value="${item}" ${w.items.includes(item)?'checked':''} ${['CPU','Memory','FPS'].includes(item)?'disabled':''}>${{CPU:'CPU',Memory:'内存',FPS:'帧率',Network:'全局网络',Battery:'电流 / 功率'}[item]}</label>`).join('')}</div></div><div class="notice mt">FPS 采集可能需要设备侧确认。正式执行前应检查无障碍、采集权限与设备档案。</div>`:''}`;
 if(w.step===3)body=`<div class="notice blue mb">${icon('check')}配置已准备好。创建后进入本地演示队列，不会触发真实测试。</div><div class="summary-block"><dl class="kv"><dt>任务名称</dt><dd>${esc(w.name)}</dd><dt>测试模块</dt><dd>${moduleNames[w.module]}</dd><dt>应用</dt><dd>${esc(w.pkg)}</dd><dt>版本</dt><dd>${esc(w.build)}</dd><dt>套件 / 场景</dt><dd>${esc(w.suite)}</dd><dt>执行设备</dt><dd>${getDevice(w.device).name} / ${getDevice(w.device).os}</dd>${isPerf?`<dt>采集时长</dt><dd>${w.duration}s</dd><dt>采集指标</dt><dd>${w.items.join(' / ')}</dd><dt>门禁</dt><dd>同档案基线 + 标准门禁 / median / 样本 ≥ 10</dd>`:''}</dl></div><p class="small muted">创建后可查看任务、推进执行、模拟失败和查看报告。刷新后会保留演示任务（若浏览器允许本地存储）。</p>`;
 openModal(`<div class="dialog-head"><div><h2 id="modal-title">新建测试任务</h2><p>统一配置，分模块执行</p></div>${btn(icon('close'),'close-modal','aria-label="关闭新建任务"','icon-only')}</div><div class="dialog-body"><div class="wizard-steps">${['基本信息','设备与配置','确认任务'].map((label,i)=>`<div class="wizard-step ${w.step===i+1?'active':''}"><b>${i+1}</b>${label}</div>`).join('')}</div>${body}<p class="error-text" id="wizard-error" role="alert"></p></div><div class="dialog-foot"><span class="foot-hint">仅创建本地演示记录</span>${w.step>1?btn('上一步','wizard-back'):btn('取消','close-modal')}${btn(w.step===3?'创建演示任务':'下一步',w.step===3?'wizard-create':'wizard-next','','primary')}</div>`)
}
function wizardNext(){readDraft();const w=wizard;if(w.step===1){if(!w.name.trim()||!w.pkg.trim()||!w.build.trim()){$('#wizard-error').textContent='请填写任务名称、应用包名和版本。';return}if(!/^[a-zA-Z]\w*(\.[a-zA-Z]\w*)+$/.test(w.pkg)){$('#wizard-error').textContent='请使用合法的应用包名，例如 com.example.xinghe。';return}}if(w.step===2){if(!w.device||['offline','unauthorized'].includes(deviceState(getDevice(w.device)))){$('#wizard-error').textContent='请选择已授权在线的设备。';return}if(w.module!=='ui'&&(!Number.isInteger(Number(w.duration))||w.duration<10||w.duration>3600)){$('#wizard-error').textContent='采集时长需要是 10–3600 之间的整数秒。';return}}w.step++;wizardRender()}
function createDemoTask(){readDraft();const w=wizard,id=String(Math.max(...tasks.map(t=>Number(t.id)||0))+1);const t={id,name:w.name.trim(),module:w.module,status:'queued',device:w.device,suite:w.suite,progress:0,time:new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}),duration:Number(w.duration),pkg:w.pkg,build:w.build,items:w.items};tasks.unshift(t);save();closeModal();taskFilter='all';taskModule='all';taskQuery='';go('tasks');taskDetail(t.id);toast('演示任务已创建，可点击「开始演示」。')}
function mutateTask(id,action){const t=getTask(id);if(!t)return;if(action==='start-task'&&t.status==='queued'){if(deviceState(getDevice(t.device))!=='idle'){toast('设备仍被其他演示任务占用，请先完成该任务。');return}t.status='running';t.progress=20}else if(action==='advance-task'&&t.status==='running'){t.progress=t.progress<40?55:t.progress<85?90:100;if(t.progress===100)t.status='passed'}else if(action==='fail-task'&&t.status==='running'){t.progress=100;t.status='failed'}else if(action==='cancel-task'&&['queued','running'].includes(t.status)){t.status='cancelled'}else return;save();render();taskDetail(t.id)}
function rerun(id){const t=getTask(id);if(!t)return;const copy={...t,id:String(Math.max(...tasks.map(t=>Number(t.id)||0))+1),name:t.name+' · 重跑',parent:t.id,status:'queued',progress:0,time:new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false})};tasks.unshift(copy);save();closeModal();if($('#drawer').open)closeDrawer();taskFilter='all';taskQuery='';taskModule='all';go('tasks');taskDetail(copy.id);toast('已创建新的演示运行，原报告保留。')}
function exportReport(id){const t=getTask(id);if(!t)return;const perf=taskHasPerf(t),summary={};if(perf)for(const k of ['memory','cpu','fps']){const m=metricForRun(t,k);summary[m.key]={median:m.median,unit:m.unit,sampleCount:t.status==='not_tested'?6:180,source:'synthetic_demo'}}const report={prototype:true,notice:'演示数据，未执行真实测试；平台导出示意，不是组件原始接口响应',runId:'RUN-'+t.id,hostRunId:'RUN-'+t.id,name:t.name,module:t.module,status:t.status,target:t.pkg||'com.example.xinghe',deviceProfile:getDevice(t.device).profile,durationS:t.duration,metricsSummary:perf?summary:null,verdict:t.status,thresholdsAtRun:perf?{mem_pss_mb:['lt',240,'fail'],cpu_process_pct:['lt',35,'warn'],fps_frame:['ge',50,'fail']}:null,reason:t.status==='not_tested'?'sample_count_below_minimum':null};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TestDock-RUN-'+t.id+'-DEMO.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示报告 JSON。')}

document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=el.dataset.id,value=el.dataset.value;
 if(a==='nav'){go(el.dataset.page);return}

 if(['start-task','advance-task','fail-task','cancel-task'].includes(a)){mutateTask(id,a);return}

 if(a==='wizard-module'){readDraft();wizard.module=value;wizard.suite=value==='perf'?'首页滑动场景':'核心链路回归';wizardRender();return}
 if(a==='wizard-next'){wizardNext();return}
 if(a==='wizard-back'){readDraft();wizard.step--;wizardRender();return}
 if(a==='wizard-create'){createDemoTask();return}
 if(a==='inspect-device'){inspectorDevice=id;uiTab='inspect';frozen=false;directControl=false;go('ui');return}
 if(a==='freeze'){if(deviceState(getDevice(inspectorDevice))!=='idle'){toast('设备被占用，仅可观察，不能采集检查。');return}frozen=!frozen;directControl=false;render();return}
 if(a==='pick-node'){
   if(!frozen){if(directControl){$('.phone-cta').textContent='确认页（演示）';$('.phone-logo').textContent='订单确认';toast('已模拟点击；没有向真实设备发送操作。')}else toast('先点击「采集检查」，在冻结快照中拾取。');return}
   selectedNode=el.dataset.node;render();return
 }
 if(a==='phone-key'){$('.phone-logo').textContent=el.dataset.key==='主屏'?'设备主屏示意':'星河生活';toast('已模拟'+el.dataset.key+'操作。');return}
 if(a==='validate-locator'){$('#locator-result').innerHTML='<span class="text-green">✓ 演示匹配：1 个节点，匹配唯一。</span><br>来源：冻结快照 SNAP-DEMO-01；非真机校验。';return}
 if(a==='copy-locator'){try{await navigator.clipboard.writeText($('#locator-expression').textContent);toast('定位描述已复制。')}catch{const selection=window.getSelection(),range=document.createRange();range.selectNodeContents($('#locator-expression'));selection.removeAllRanges();selection.addRange(range);toast('已选中定位描述，请按 Ctrl+C 复制。')}return}
 if(a==='suite'){const s=suites[Number(el.dataset.index)];simpleModal(esc(s.name),'套件详情 / 演示元数据',`<dl class="kv"><dt>执行框架</dt><dd>pytest / mobile-auto</dd><dt>用例数量</dt><dd>${s.count}（演示）</dd><dt>覆盖范围</dt><dd>${s.desc}</dd></dl><h3 class="mt">步骤示意</h3><pre class="code-block">${esc('from mobile_auto import Locator, Target\n\nawait adapter.goto("")\ntarget = Target(Locator.RESOURCE_ID,\n    "com.example.xinghe:id/checkout")\nawait adapter.click(target)\nassert await adapter.wait_for(\n    Target(Locator.TEXT, "订单确认"))')}</pre><div class="notice blue">调用形式对照现有 MobileAdapter 与 Target 契约；业务流程是演示示例，不是已扫描到的真实用例。</div>`,btn('关闭','close-modal')+btn('运行套件','run-suite','data-index="'+el.dataset.index+'"','primary'));return}
 if(a==='run-suite'){const s=suites[Number(el.dataset.index)];newTask('ui',s.name);wizard.name=s.name+' · 回归测试';wizardRender();return}
 if(a==='device-detail'){const d=getDevice(id),s=deviceState(d);simpleModal(d.name,'设备档案 / 演示数据',`<dl class="kv"><dt>设备档案</dt><dd>${d.profile}</dd><dt>设备编号</dt><dd>${d.serial}</dd><dt>连接状态</dt><dd>${badge(s)}</dd><dt>执行节点</dt><dd>${d.host}</dd><dt>UI 模块</dt><dd>${['idle','busy'].includes(s)?'支持预览与调试（演示）':'未就绪'}</dd><dt>性能模块</dt><dd>${['idle','busy'].includes(s)?'执行前需检查采集权限与 SoloPi':'未就绪'}</dd></dl><div class="notice mt">${s==='unauthorized'?'请在设备侧确认 USB 调试授权，原型不会替你授权。':s==='offline'?'设备离线，真实接入时需要检查线缆、ADB 与设备状态。':s==='busy'?'测试任务持有设备，允许只读观察，不开放直接控制。':'当前无演示任务占用，可用于新任务。'}</div>`);return}
 if(a==='evidence-tree'){simpleModal('UI 树示意','RUN-'+esc(id)+' / 非真实采集',`<pre class="code-block">&lt;hierarchy&gt;
  &lt;node class="android.widget.FrameLayout"&gt;
    &lt;node text="星河生活" /&gt;
    &lt;node text="去结算"
      resource-id="com.example.xinghe:id/checkout" /&gt;
  &lt;/node&gt;
&lt;/hierarchy&gt;

预期的 order_confirm 节点未出现。</pre>`,btn('返回报告','report','data-id="'+id+'"','primary'));return}
 if(a==='template-new'){simpleModal('新建图像模板演示','保存演示元数据，不生成真实图片',`<form id="template-form"><label class="field mb"><span>模板逻辑名 *</span><input name="name" aria-label="模板逻辑名" value="home/checkout" maxlength="80" required pattern="[a-zA-Z0-9_/-]+"><small>英文、数字、下划线、短横线或 /；同名保存会生成新版本。</small></label><label class="field mb"><span>匹配阈值</span><input name="confidence" aria-label="匹配阈值" type="number" value="0.9" min="0.01" max="1" step=".01" required></label><div class="summary-block">示意区域：购物袋页面「去结算」按钮<br><span class="small muted">实际接入将使用冻结快照框选区域与图片摘要。</span></div><button class="btn primary" type="submit">保存演示模板</button></form>`);return}
 if(a==='template-view'){const t=templates[Number(el.dataset.index)];simpleModal('模板定位描述',esc(t.name)+' / v'+t.version,`<div class="notice blue">这是模板元数据演示；尚无真实模板图片。</div><pre class="code-block" id="locator-expression">${esc('Target(Locator.IMAGE, "'+t.name+'", confidence='+t.confidence+')')}</pre><p class="small muted">旧模板版本保持不可变；正式接入将通过清单确定当前版本。</p>`,btn('关闭','close-modal')+btn('复制表达式','copy-locator','','primary'));return}
 if(a==='help'){simpleModal('原型使用说明','TestDock / APP 自动化测试平台',`<div class="stack"><p>这是一份离线交互 HTML。所有数据均为演示，不需要登录，不会触发真实设备操作。</p><div class="summary-block"><strong>建议体验路径</strong><ol class="small"><li>工作台 → 新建测试任务 → 选择模块与设备。</li><li>任务详情 → 开始演示 → 推进演示或模拟失败。</li><li>查看报告 → 分析失败证据或性能指标。</li><li>UI 工作区 → 设备调试 → 采集检查 → 验证定位。</li><li>性能工作区 → 切换基线 / 样本状态 → 配置门禁。</li></ol></div><p class="small muted">任务、模板元数据和分析规则在浏览器允许时保存在本地；真实后端、远程鉴权和任务调度尚未接入。调研来源与能力边界见「接入说明」。</p></div>`);return}
});

document.addEventListener('change',e=>{
 const v=e.target.value;
 if(e.target.id==='task-module'){taskModule=v;$('#task-results').innerHTML=filteredTasks()}
 if(e.target.id==='task-status'){taskFilter=v;$('#task-results').innerHTML=filteredTasks()}
