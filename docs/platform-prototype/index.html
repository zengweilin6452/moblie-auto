const heading=(title,desc,actions='')=>`<div class="page-heading"><div><h1>${title}</h1><p>${desc}</p></div><div class="flex actions">${actions}</div></div>`;
const tabs=(items,active,action)=>`<div class="tabs">${items.map(([id,title])=>`<button class="tab ${id===active?'active':''}" data-action="${action}" data-value="${id}" aria-pressed="${id===active}">${title}</button>`).join('')}</div>`;
const empty=(title,description)=>`<div class="empty">${icon('search')}<strong>${title}</strong>${description}</div>`;
function context(){return `<div class="context-strip"><span class="app-icon">${icon('layers')}</span><strong>星河产品</strong><span class="divider"></span><label class="flex"><span class="muted">目标端</span><select id="target-scope" aria-label="目标端"><option value="all" ${targetScope==='all'?'selected':''}>全部目标端</option>${Object.entries(targetCatalog).map(([k,t])=>`<option value="${k}" ${targetScope===k?'selected':''}>${t.label}</option>`).join('')}</select></label><span class="grow"></span><span class="muted">${targetScope==='all'?'统一项目 / 三个应用目标':targetCatalog[targetScope].application} · 测试环境</span></div>`}

或站点逻辑标识"},{"name":"archived_at","definition":"archived_at timestamptz","description":"归档时间"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, id, platform)","UNIQUE (project_id, platform, identifier)"],"notes":""},{"name":"app_builds","title":"应用构建","group":"基础资产","purpose":"固定待测构建；移动包与 Web 部署均采用同一版本记录。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"application_id","definition":"application_id uuid NOT NULL","description":"所属应用"},{"name":"version","definition":"version text NOT NULL","description":"业务版本"},{"name":"build_key","definition":"build_key text NOT NULL","description":"CI 构建号或部署版本，不使用可变 latest"},{"name":"source_commit","definition":"source_commit text","description":"来源提交号"},{"name":"storage_key","definition":"storage_key text","description":"包文件存储键；Web 部署可为空"},{"name":"sha256","definition":"sha256 text CHECK (sha256 ~ '^[0-9a-f]{64}$')","description":"包校验摘要"},{"name":"metadata","definition":"metadata jsonb NOT NULL DEFAULT '{}'::jsonb","description":"包属性或部署元数据"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, application_id, id)","UNIQUE (project_id, application_id, build_key)","FOREIGN KEY (project_id, application_id) REFERENCES applications(project_id, id)","CHECK (jsonb_typeof(metadata) = 'object')"],"notes":""},{"name":"environments","title":"测试环境","group":"基础资产","purpose":"保存各环境的非敏感配置，实际站点地址可随环境区分。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"name","definition":"name text NOT NULL","description":"staging、qa 等环境名"},{"name":"config","definition":"config jsonb NOT NULL DEFAULT '{}'::jsonb","description":"地址映射、变量及 schemaVersion；禁止明文凭据"},{"name":"secret_ref","definition":"secret_ref text","description":"密钥管理系统引用，不能是密钥值"},{"name":"archived_at","definition":"archived_at timestamptz","description":"归档时间"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, name)","CHECK (jsonb_typeof(config) = 'object')"],"notes":""},{"name":"execution_nodes","title":"执行节点","group":"执行资源","purpose":"宿主 Agent 与可用适配器，初期按项目独占。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"name","definition":"name text NOT NULL","description":"节点名称"},{"name":"agent_version","definition":"agent_version text NOT NULL","description":"Agent 版本"},{"name":"capabilities","definition":"capabilities jsonb NOT NULL DEFAULT '{}'::jsonb","description":"已注册适配器及其版本"},{"name":"status","definition":"status text NOT NULL CHECK (status IN ('online','offline','draining'))","description":"节点状态"},{"name":"heartbeat_at","definition":"heartbeat_at timestamptz","description":"最近心跳时间"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, name)","CHECK (jsonb_typeof(capabilities) = 'object')"],"notes":"宿主凭据不入 capabilities；首期不设计跨项目共享节点池。"},{"name":"resource_profiles","title":"资源档案","group":"执行资源","purpose":"不可变的可比性档案：系统、设备或浏览器、采集器、分辨率、指标版本。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"platform","definition":"platform text NOT NULL CHECK (platform IN ('android','ios','web'))","description":"目标端"},{"name":"name","definition":"name text NOT NULL","description":"档案展示名"},{"name":"fingerprint","definition":"fingerprint text NOT NULL CHECK (fingerprint ~ '^[0-9a-f]{64}$')","description":"规范化档案的 SHA-256"},{"name":"spec","definition":"spec jsonb NOT NULL","description":"结构化档案及 schemaVersion"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, id, platform)","UNIQUE (project_id, platform, fingerprint)","CHECK (jsonb_typeof(spec) = 'object')"],"notes":"档案内容变化新增记录，不覆盖旧记录；性能比较还须校验应用、场景和指标口径。"},{"name":"execution_resources","title":"执行实例","group":"执行资源","purpose":"真机、模拟器或浏览器槽位。每个实例只承载一个活动运行。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"node_id","definition":"node_id uuid NOT NULL","description":"执行节点"},{"name":"profile_id","definition":"profile_id uuid NOT NULL","description":"当前不可变档案"},{"name":"platform","definition":"platform text NOT NULL CHECK (platform IN ('android','ios','web'))","description":"目标端"},{"name":"resource_key","definition":"resource_key text NOT NULL","description":"宿主内设备标识或浏览器槽位"},{"name":"kind","definition":"kind text NOT NULL CHECK (kind IN ('device','simulator','browser_slot'))","description":"资源类型"},{"name":"status","definition":"status text NOT NULL CHECK (status IN ('ready','offline','unauthorized','draining'))","description":"连接状态；占用从租约推导"},{"name":"fence_counter","definition":"fence_counter bigint NOT NULL DEFAULT 0 CHECK (fence_counter >= 0)","description":"每次分配递增的隔离令牌"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, id, platform)","UNIQUE (project_id, node_id, resource_key)","FOREIGN KEY (project_id, node_id) REFERENCES execution_nodes(project_id, id)","FOREIGN KEY (project_id, profile_id, platform) REFERENCES resource_profiles(project_id, id, platform)","CHECK ((platform = 'web' AND kind = 'browser_slot') OR (platform <> 'web' AND kind IN ('device','simulator')))"],"notes":"Web 并发通过多个独立槽位表示；资源重新建档须在无活动租约时处理。"},{"name":"test_suites","title":"测试套件","group":"测试定义","purpose":"登记代码维护的 UI 用例或性能场景，不把脚本正文塞进数据库。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"application_id","definition":"application_id uuid NOT NULL","description":"所属应用"},{"name":"name","definition":"name text NOT NULL","description":"套件或场景名"},{"name":"test_type","definition":"test_type text NOT NULL CHECK (test_type IN ('ui','performance','joint'))","description":"测试类型；joint 为编排"},{"name":"archived_at","definition":"archived_at timestamptz","description":"归档时间"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, application_id, id)","UNIQUE (project_id, application_id, name)","FOREIGN KEY (project_id, application_id) REFERENCES applications(project_id, id)"],"notes":""},{"name":"suite_versions","title":"套件版本","group":"测试定义","purpose":"固定仓库、提交及选择器，旧运行可追溯到当时的用例。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"application_id","definition":"application_id uuid NOT NULL","description":"应用关联约束"},{"name":"suite_id","definition":"suite_id uuid NOT NULL","description":"逻辑套件"},{"name":"version","definition":"version integer NOT NULL CHECK (version > 0)","description":"套件修订序号"},{"name":"source_ref","definition":"source_ref text NOT NULL","description":"不含凭据的仓库或受控用例来源"},{"name":"source_commit","definition":"source_commit text NOT NULL","description":"固定提交标识"},{"name":"manifest","definition":"manifest jsonb NOT NULL","description":"用例 key、入口、场景及 schemaVersion"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, application_id, id)","UNIQUE (project_id, suite_id, version)","FOREIGN KEY (project_id, application_id, suite_id) REFERENCES test_suites(project_id, application_id, id)","CHECK (jsonb_typeof(manifest) = 'object')"],"notes":""},{"name":"test_tasks","title":"测试任务","group":"任务运行","purpose":"用户可编辑的逻辑任务；不存通过或失败结果。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"application_id","definition":"application_id uuid NOT NULL","description":"所属应用"},{"name":"name","definition":"name text NOT NULL","description":"任务名"},{"name":"lifecycle","definition":"lifecycle text NOT NULL DEFAULT 'draft' CHECK (lifecycle IN ('draft','ready','archived'))","description":"配置生命周期，非执行状态"},{"name":"lock_version","definition":"lock_version integer NOT NULL DEFAULT 1 CHECK (lock_version > 0)","description":"乐观锁版本"},{"name":"created_by","definition":"created_by text NOT NULL","description":"身份主体或服务账号引用"},{"name":"updated_at","definition":"updated_at timestamptz NOT NULL DEFAULT now()","description":"服务端更新时显式赋值"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, application_id, id)","FOREIGN KEY (project_id, application_id) REFERENCES applications(project_id, id)"],"notes":"Web/iOS 未接入时只能是 draft；计划能力不能用设备数据冒充已就绪。"},{"name":"task_revisions","title":"任务配置版本","group":"任务运行","purpose":"每次保存新增不可变修订；运行只引用已验证修订。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"application_id","definition":"application_id uuid NOT NULL","description":"应用关联约束"},{"name":"task_id","definition":"task_id uuid NOT NULL","description":"逻辑任务"},{"name":"revision","definition":"revision integer NOT NULL CHECK (revision > 0)","description":"配置版本号"},{"name":"environment_id","definition":"environment_id uuid NOT NULL","description":"环境"},{"name":"build_id","definition":"build_id uuid","description":"草稿可缺构建，提交前校验"},{"name":"suite_version_id","definition":"suite_version_id uuid","description":"草稿可缺套件版本，提交前校验"},{"name":"test_type","definition":"test_type text NOT NULL CHECK (test_type IN ('ui','performance','joint'))","description":"类型快照"},{"name":"readiness","definition":"readiness text NOT NULL DEFAULT 'draft' CHECK (readiness IN ('draft','validated'))","description":"配置校验状态"},{"name":"config","definition":"config jsonb NOT NULL","description":"脱敏配置、资源需求、适配器及 schemaVersion"},{"name":"created_by","definition":"created_by text NOT NULL","description":"保存者引用"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, application_id, id)","UNIQUE (project_id, task_id, revision)","FOREIGN KEY (project_id, application_id, task_id) REFERENCES test_tasks(project_id, application_id, id)","FOREIGN KEY (project_id, environment_id) REFERENCES environments(project_id, id)","FOREIGN KEY (project_id, application_id, build_id) REFERENCES app_builds(project_id, application_id, id)","FOREIGN KEY (project_id, application_id, suite_version_id) REFERENCES suite_versions(project_id, application_id, id)","CHECK (jsonb_typeof(config) = 'object')","CHECK (readiness = 'draft' OR (build_id IS NOT NULL AND suite_version_id IS NOT NULL))"],"notes":"只有字段完整不代表可运行；适配器能力、套件类型及配置 schema 仍由提交事务验证。"},{"name":"test_runs","title":"测试运行","group":"任务运行","purpose":"一次提交或重跑对应一行，保留执行状态、最终结论和当时配置。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"application_id","definition":"application_id uuid NOT NULL","description":"目标应用"},{"name":"platform","definition":"platform text NOT NULL CHECK (platform IN ('android','ios','web'))","description":"目标端查询维度"},{"name":"revision_id","definition":"revision_id uuid NOT NULL","description":"固定任务修订"},{"name":"parent_run_id","definition":"parent_run_id uuid","description":"重跑来源；同项目同应用"},{"name":"request_key","definition":"request_key text NOT NULL","description":"项目内提交幂等键"},{"name":"state","definition":"state text NOT NULL DEFAULT 'queued' CHECK (state IN ('queued','dispatching','running','finalizing','completed','errored','cancelled'))","description":"执行状态，与测试结论分离"},{"name":"outcome","definition":"outcome text CHECK (outcome IN ('passed','failed','not_tested'))","description":"完成时的测试结论"},{"name":"reason_code","definition":"reason_code text","description":"未判定、取消或基础设施错误原因码"},{"name":"resource_id","definition":"resource_id uuid","description":"实际执行实例，排队时为空"},{"name":"profile_id","definition":"profile_id uuid","description":"实际使用的固定档案"},{"name":"config_snapshot","definition":"config_snapshot jsonb NOT NULL","description":"固定配置、版本及脱敏环境快照"},{"name":"lock_version","definition":"lock_version integer NOT NULL DEFAULT 1 CHECK (lock_version > 0)","description":"状态更新 CAS 版本"},{"name":"started_at","definition":"started_at timestamptz","description":"实际开始时间"},{"name":"ended_at","definition":"ended_at timestamptz","description":"终态时间"},{"name":"created_by","definition":"created_by text NOT NULL","description":"触发者引用"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, application_id, id)","UNIQUE (project_id, id, resource_id)","UNIQUE (project_id, request_key)","FOREIGN KEY (project_id, application_id, platform) REFERENCES applications(project_id, id, platform)","FOREIGN KEY (project_id, application_id, revision_id) REFERENCES task_revisions(project_id, application_id, id)","FOREIGN KEY (project_id, application_id, parent_run_id) REFERENCES test_runs(project_id, application_id, id)","FOREIGN KEY (project_id, resource_id, platform) REFERENCES execution_resources(project_id, id, platform)","FOREIGN KEY (project_id, profile_id, platform) REFERENCES resource_profiles(project_id, id, platform)","CHECK (jsonb_typeof(config_snapshot) = 'object')","CHECK ((state = 'completed' AND outcome IS NOT NULL) OR (state <> 'completed' AND outcome IS NULL))","CHECK ((state IN ('completed','errored','cancelled')) = (ended_at IS NOT NULL))","CHECK (state NOT IN ('running','finalizing','completed') OR (resource_id IS NOT NULL AND started_at IS NOT NULL))","CHECK ((resource_id IS NULL) = (profile_id IS NULL))","CHECK (ended_at IS NULL OR ended_at >= created_at)","CHECK (started_at IS NULL OR started_at >= created_at)","CHECK (ended_at IS NULL OR started_at IS NULL OR ended_at >= started_at)"],"notes":"终态只追加新运行或新试算，不改原始结论；这种不可变性及状态转换须由后端写入边界实现。"},{"name":"debug_sessions","title":"调试会话","group":"执行资源","purpose":"人工设备控制使用短期调试会话，与自动运行竞争同一资源租约。","notes":"只读预览不占独占租约；会发送输入、冻结采集等操作按宿主冲突规则受控。断线不能立即释放资源。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"调试会话 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"resource_id","definition":"resource_id uuid NOT NULL","description":"调试实例"},{"name":"actor_ref","definition":"actor_ref text NOT NULL","description":"操作人身份引用"},{"name":"state","definition":"state text NOT NULL CHECK (state IN ('opening','active','closing','closed','lost'))","description":"调试生命周期"},{"name":"expires_at","definition":"expires_at timestamptz NOT NULL","description":"会话过期时间"},{"name":"closed_at","definition":"closed_at timestamptz","description":"关闭或确认失联时间"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, id, resource_id)","FOREIGN KEY (project_id, resource_id) REFERENCES execution_resources(project_id, id)","CHECK (expires_at > created_at)","CHECK ((state IN ('closed','lost')) = (closed_at IS NOT NULL))","CHECK (closed_at IS NULL OR closed_at >= created_at)"]},{"name":"resource_leases","title":"资源租约","group":"执行资源","purpose":"保留运行或调试的独占历史，用 fencing token 拒绝过期执行者。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"resource_id","definition":"resource_id uuid NOT NULL","description":"被占用实例"},{"name":"run_id","definition":"run_id uuid","description":"自动运行归属，与调试会话二选一"},{"name":"debug_session_id","definition":"debug_session_id uuid","description":"人工调试归属，与运行二选一"},{"name":"fencing_token","definition":"fencing_token bigint NOT NULL CHECK (fencing_token > 0)","description":"分配时递增并写入实例计数器"},{"name":"holder_id","definition":"holder_id text NOT NULL","description":"Agent 实例标识，不含凭据"},{"name":"expires_at","definition":"expires_at timestamptz NOT NULL","description":"心跳到期时间"},{"name":"released_at","definition":"released_at timestamptz","description":"显式释放，过期不等于安全释放"},{"name":"release_reason","definition":"release_reason text","description":"正常完成、取消确认、失联隔离等"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, resource_id, fencing_token)","FOREIGN KEY (project_id, run_id, resource_id) REFERENCES test_runs(project_id, id, resource_id)","CHECK (expires_at > created_at)","CHECK (released_at IS NULL OR released_at >= created_at)","FOREIGN KEY (project_id, debug_session_id, resource_id) REFERENCES debug_sessions(project_id, id, resource_id)","CHECK ((run_id IS NOT NULL) <> (debug_session_id IS NOT NULL))"],"notes":"部分唯一索引保证每实例、运行或调试会话最多一条未释放租约；超时回收仍需 Agent 隔离旧进程。"},{"name":"run_components","title":"运行组件","group":"结果证据","purpose":"一次运行下的 UI/性能子结果。联动共用运行和租约，分别保留结论。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"run_id","definition":"run_id uuid NOT NULL","description":"平台运行"},{"name":"kind","definition":"kind text NOT NULL CHECK (kind IN ('ui','performance'))","description":"子任务能力"},{"name":"adapter_key","definition":"adapter_key text NOT NULL","description":"适配器名"},{"name":"adapter_version","definition":"adapter_version text NOT NULL","description":"适配器版本"},{"name":"external_run_id","definition":"external_run_id text","description":"组件原始 runId"},{"name":"state","definition":"state text NOT NULL CHECK (state IN ('pending','running','completed','errored','cancelled'))","description":"组件状态"},{"name":"outcome","definition":"outcome text CHECK (outcome IN ('passed','failed','not_tested'))","description":"测试结论"},{"name":"summary","definition":"summary jsonb NOT NULL DEFAULT '{}'::jsonb","description":"计数、警告、完整性、原始 schemaVersion"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, run_id, id)","UNIQUE (project_id, run_id, kind)","FOREIGN KEY (project_id, run_id) REFERENCES test_runs(project_id, id)","CHECK (jsonb_typeof(summary) = 'object')","CHECK ((state = 'completed' AND outcome IS NOT NULL) OR (state <> 'completed' AND outcome IS NULL))"],"notes":""},{"name":"case_results","title":"用例结果","group":"结果证据","purpose":"每个用例的执行尝试独立保存，可区分用例重试与整次重跑。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"component_id","definition":"component_id uuid NOT NULL","description":"UI 组件结果"},{"name":"case_key","definition":"case_key text NOT NULL","description":"套件版本中的稳定用例 key"},{"name":"attempt","definition":"attempt integer NOT NULL DEFAULT 1 CHECK (attempt > 0)","description":"同一次运行内用例尝试次数"},{"name":"outcome","definition":"outcome text NOT NULL CHECK (outcome IN ('passed','failed','skipped','errored'))","description":"用例结果"},{"name":"duration_ms","definition":"duration_ms bigint CHECK (duration_ms >= 0)","description":"用例耗时"},{"name":"error_summary","definition":"error_summary text","description":"脱敏错误摘要"},{"name":"steps","definition":"steps jsonb NOT NULL DEFAULT '[]'::jsonb","description":"小体积步骤摘要；完整日志存证据文件"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, component_id, case_key, attempt)","FOREIGN KEY (project_id, component_id) REFERENCES run_components(project_id, id)","CHECK (jsonb_typeof(steps) = 'array')"],"notes":"后端只接受 UI 组件的用例记录，校验 case_key 属于固定 suite_version。"},{"name":"artifacts","title":"证据文件","group":"结果证据","purpose":"保存文件元数据和私有存储键，截图、日志、录像、曲线均通过此表归档。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"run_id","definition":"run_id uuid NOT NULL","description":"运行归属"},{"name":"component_id","definition":"component_id uuid","description":"可选子组件归属；总体报告为空"},{"name":"logical_key","definition":"logical_key text NOT NULL","description":"运行内唯一逻辑键，含用例或步骤路径"},{"name":"kind","definition":"kind text NOT NULL CHECK (kind IN ('screenshot','ui_tree','video','log','trace','metric_series','report_json','report_html','other'))","description":"证据类型"},{"name":"storage_key","definition":"storage_key text NOT NULL","description":"受控文件或对象存储键，不存临时签名 URL"},{"name":"mime_type","definition":"mime_type text NOT NULL","description":"内容类型"},{"name":"byte_size","definition":"byte_size bigint NOT NULL CHECK (byte_size >= 0)","description":"文件字节数"},{"name":"sha256","definition":"sha256 text NOT NULL CHECK (sha256 ~ '^[0-9a-f]{64}$')","description":"完整性摘要"},{"name":"schema_version","definition":"schema_version text","description":"原始报告或曲线 schema"},{"name":"availability","definition":"availability text NOT NULL DEFAULT 'available' CHECK (availability IN ('available','missing','expired'))","description":"文件可用状态"},{"name":"expires_at","definition":"expires_at timestamptz","description":"保留策略到期时间"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, run_id, logical_key)","UNIQUE (project_id, storage_key)","FOREIGN KEY (project_id, run_id) REFERENCES test_runs(project_id, id)","FOREIGN KEY (project_id, run_id, component_id) REFERENCES run_components(project_id, run_id, id)"],"notes":"文件先写临时键并校验成功，再提交元数据；无法做到数据库与文件原子提交，需幂等补偿。"},{"name":"metric_summaries","title":"性能摘要","group":"性能质量","purpose":"按指标、统计窗口和统计量保存查询所需的小体积摘要。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"component_id","definition":"component_id uuid NOT NULL","description":"性能组件"},{"name":"metric_key","definition":"metric_key text NOT NULL","description":"有命名空间的指标键，例如 android.memory.pss"},{"name":"metric_version","definition":"metric_version text NOT NULL","description":"指标口径版本"},{"name":"unit","definition":"unit text NOT NULL","description":"显式单位，例如 MiB、ms、percent"},{"name":"scope","definition":"scope text NOT NULL","description":"app、device、page 等测量范围"},{"name":"window_key","definition":"window_key text NOT NULL","description":"全程或步骤窗口"},{"name":"statistic","definition":"statistic text NOT NULL CHECK (statistic IN ('median','p95','mean','min','max'))","description":"统计量，现有 Android 判定使用 median"},{"name":"sample_count","definition":"sample_count integer NOT NULL CHECK (sample_count >= 0)","description":"有效样本数"},{"name":"value","definition":"value double precision","description":"缺失时为 NULL，不能补 0"},{"name":"missing_reason","definition":"missing_reason text","description":"缺失原因"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, component_id, metric_key, metric_version, scope, window_key, statistic)","FOREIGN KEY (project_id, component_id) REFERENCES run_components(project_id, id)","CHECK ((value IS NULL AND missing_reason IS NOT NULL) OR (value IS NOT NULL AND missing_reason IS NULL))","CHECK (value IS NULL OR (sample_count > 0 AND value > '-Infinity'::float8 AND value < 'Infinity'::float8))"],"notes":"采样率、单位换算、窗口边界属于适配器契约；原始 series 单独归档，不逐点写业务库。"},{"name":"baselines","title":"基线版本","group":"性能质量","purpose":"不可变的对照版本；源运行和全部可比性信息一并保留。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"application_id","definition":"application_id uuid NOT NULL","description":"应用"},{"name":"environment_id","definition":"environment_id uuid NOT NULL","description":"环境"},{"name":"suite_version_id","definition":"suite_version_id uuid NOT NULL","description":"场景版本"},{"name":"profile_id","definition":"profile_id uuid NOT NULL","description":"可比资源档案"},{"name":"source_component_id","definition":"source_component_id uuid NOT NULL","description":"来源性能组件"},{"name":"name","definition":"name text NOT NULL","description":"基线逻辑名"},{"name":"version","definition":"version integer NOT NULL CHECK (version > 0)","description":"基线修订号"},{"name":"metrics_snapshot","definition":"metrics_snapshot jsonb NOT NULL","description":"指标口径、统计量、值及 schemaVersion"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, application_id, name, version)","FOREIGN KEY (project_id, application_id) REFERENCES applications(project_id, id)","FOREIGN KEY (project_id, environment_id) REFERENCES environments(project_id, id)","FOREIGN KEY (project_id, application_id, suite_version_id) REFERENCES suite_versions(project_id, application_id, id)","FOREIGN KEY (project_id, profile_id) REFERENCES resource_profiles(project_id, id)","FOREIGN KEY (project_id, source_component_id) REFERENCES run_components(project_id, id)","CHECK (jsonb_typeof(metrics_snapshot) = 'object')"],"notes":"来源组件的应用、场景、环境、profile 和完整性须由创建基线事务验证；不靠跨表 CHECK。"},{"name":"gate_policies","title":"门禁规则版本","group":"性能质量","purpose":"平台持有门槛，适配器负责正确的测量与统计。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"application_id","definition":"application_id uuid NOT NULL","description":"规则适用应用"},{"name":"name","definition":"name text NOT NULL","description":"逻辑规则名"},{"name":"version","definition":"version integer NOT NULL CHECK (version > 0)","description":"不可变规则版本"},{"name":"rules","definition":"rules jsonb NOT NULL","description":"带 schemaVersion 的指标、单位、窗口、比较符、阈值、warn/fail 和样本下限"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, application_id, name, version)","FOREIGN KEY (project_id, application_id) REFERENCES applications(project_id, id)","CHECK (jsonb_typeof(rules) = 'object')"],"notes":""},{"name":"gate_evaluations","title":"门禁判定","group":"性能质量","purpose":"原始判定与后续试算分开保存；改规则不会覆盖历史结论。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"component_id","definition":"component_id uuid NOT NULL","description":"性能组件"},{"name":"policy_id","definition":"policy_id uuid NOT NULL","description":"固定规则版本"},{"name":"baseline_id","definition":"baseline_id uuid","description":"可为空，缺失时形成 not_tested 及原因"},{"name":"mode","definition":"mode text NOT NULL CHECK (mode IN ('original','reanalysis'))","description":"原始判定或后续试算"},{"name":"request_key","definition":"request_key text NOT NULL","description":"判定请求幂等键"},{"name":"verdict","definition":"verdict text NOT NULL CHECK (verdict IN ('passed','failed','not_tested'))","description":"三态结论"},{"name":"reason_code","definition":"reason_code text","description":"未判定原因码"},{"name":"checks","definition":"checks jsonb NOT NULL DEFAULT '[]'::jsonb","description":"每项实际值、阈值、单位、样本数及结果"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, request_key)","FOREIGN KEY (project_id, component_id) REFERENCES run_components(project_id, id)","FOREIGN KEY (project_id, policy_id) REFERENCES gate_policies(project_id, id)","FOREIGN KEY (project_id, baseline_id) REFERENCES baselines(project_id, id)","CHECK (jsonb_typeof(checks) = 'array')","CHECK (verdict <> 'not_tested' OR reason_code IS NOT NULL)"],"notes":"同项目外键不保证规则与基线适用当前应用；服务必须检查完整可比性。"},{"name":"run_events","title":"运行事件","group":"治理追溯","purpose":"状态变化、步骤标记、接入事件按运行顺序追加，支持断线续看。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"run_id","definition":"run_id uuid NOT NULL","description":"运行"},{"name":"sequence","definition":"sequence bigint NOT NULL CHECK (sequence > 0)","description":"服务端在运行锁内分配的顺序号"},{"name":"source_key","definition":"source_key text NOT NULL","description":"事件生产者"},{"name":"source_event_id","definition":"source_event_id text NOT NULL","description":"生产者侧幂等事件 ID"},{"name":"event_type","definition":"event_type text NOT NULL","description":"状态、步骤标记或警告类型"},{"name":"payload","definition":"payload jsonb NOT NULL DEFAULT '{}'::jsonb","description":"小体积脱敏负载；完整日志走 artifacts"},{"name":"occurred_at","definition":"occurred_at timestamptz NOT NULL","description":"事件发生时间"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","UNIQUE (project_id, run_id, sequence)","UNIQUE (project_id, run_id, source_key, source_event_id)","FOREIGN KEY (project_id, run_id) REFERENCES test_runs(project_id, id)","CHECK (jsonb_typeof(payload) = 'object')"],"notes":""},{"name":"audit_events","title":"审计事件","group":"治理追溯","purpose":"记录谁修改配置、发起运行或调整规则，不承载完整业务数据。","fields":[{"name":"id","definition":"id uuid PRIMARY KEY","description":"服务端生成 UUID"},{"name":"project_id","definition":"project_id uuid NOT NULL REFERENCES projects(id)","description":"项目归属"},{"name":"actor_ref","definition":"actor_ref text NOT NULL","description":"稳定用户或服务账号引用"},{"name":"action","definition":"action text NOT NULL","description":"业务动作"},{"name":"entity_type","definition":"entity_type text NOT NULL","description":"目标实体类型"},{"name":"entity_id","definition":"entity_id uuid NOT NULL","description":"目标 ID，历史追溯引用而非跨表通用外键"},{"name":"request_id","definition":"request_id text NOT NULL","description":"请求关联标识"},{"name":"changes","definition":"changes jsonb NOT NULL DEFAULT '{}'::jsonb","description":"脱敏差异摘要，禁止存凭据"},{"name":"created_at","definition":"created_at timestamptz NOT NULL DEFAULT now()","description":"创建时间，统一 UTC"}],"constraints":["UNIQUE (project_id, id)","CHECK (jsonb_typeof(changes) = 'object')"],"notes":"只追加；审计主体与实体是否合法由授权后的业务事务写入。"}];
const databaseFlows={"save":{"title":"保存配置与重跑","steps":[["保存草稿","锁定逻辑任务并校验乐观锁，新增配置版本。Web / iOS 未接入时保持 draft。",["test_tasks","task_revisions"]],["验证并提交","校验应用、构建、套件、环境与适配器，把当前配置固定为运行快照。幂等键重复时不重复创建。",["app_builds","suite_versions","test_runs"]],["执行和归档","每次运行拥有自己的组件结果与证据。通过、失败、未判定与执行错误分开记录。",["run_components","case_results","artifacts"]],["重新运行","创建新的 test_run，parent_run_id 指向原运行。默认复用原配置版本，保留全部历史。",["test_runs","task_revisions"]]]},"lease":{"title":"资源分配与人工调试","steps":[["竞争同一资源","运行或人工调试申请同一独占实例。只读预览与可发送输入的会话分别处理。",["test_runs","debug_sessions"]],["事务领取租约","锁定资源、验证就绪状态，递增 fencing token。部分唯一索引阻止同时出现两条未释放租约。",["execution_resources","resource_leases"]],["执行并续租","Agent 每次命令和写回检查 holder 与 token。平台租约仍需遵循宿主 DeviceSession / DeviceGate。",["resource_leases","run_events"]],["确认后释放","超时只触发检查。旧进程未停止或隔离时，资源保持不可分配，避免两个执行者同时控制设备。",["execution_resources","resource_leases"]]]},"report":{"title":"结果与证据归档","steps":[["固定运行来源","记录平台 run ID、组件 external_run_id、适配器版本和完整性信息。",["test_runs","run_components"]],["先校验文件","将截图、录像、原始曲线和日志写入私有文件存储，校验摘要；数据库保存键和元数据。",["artifacts"]],["写入可查询摘要","保留用例尝试和指标窗口、单位、scope、样本数。缺失指标为 NULL，不补零。",["case_results","metric_summaries"]],["完成与对账","证据策略满足后完成运行。文件丢失标记 missing，后续对账处理，不修改原始测试结论。",["test_runs","artifacts","run_events"]]]},"gate":{"title":"基线与规则试算","steps":[["选择可比基线","匹配应用、环境、场景、资源档案、指标单位与统计窗口。不同端不能直接比较。",["baselines","resource_profiles","metric_summaries"]],["固定规则版本","阈值、比较符、样本下限和 warn/fail 级别随版本保存。已有规则版本不可覆盖。",["gate_policies"]],["保留原始判定","每个性能组件最多一个 original 判定；样本不足或基线不可比得到 not_tested。",["gate_evaluations","run_components"]],["追加试算","新规则生成 reanalysis 记录，原运行 outcome 和原始报告保持不变。",["gate_evaluations","test_runs","artifacts"]]]}};
let dbTab='overview',dbSelected='test_runs',dbQuery='',dbGroup='all',dbFlow='save';
function dbLink(name){const t=databaseTables.find(t=>t.name===name);return `<button class="btn small" data-action="db-table" data-value="${name}">${esc(t?.title||name)}</button>`}
function databasePage(){return heading('数据设计','多端共用的数据模型 · 设计草案 v1 / PostgreSQL',`<a class="btn" href="database-design.md" target="_blank" rel="noopener">设计文档</a><a class="btn primary" href="schema.sql" download>下载建表草案</a>`)+`<div class="notice blue mb">${icon('layers')}<div>架构评审视图，适用于全部目标端。当前原型仍使用浏览器本地存储，未连接数据库；SQL 尚未经过真实建库验证。</div></div>`+tabs([['overview','关系总览'],['dictionary','字段字典'],['flows','写入流程']],dbTab,'db-tab')+(dbTab==='overview'?databaseOverview():dbTab==='dictionary'?databaseDictionaryPage():databaseFlowPage())}
function databaseOverview(){const lanes=[
['从配置到运行','一条任务可以有多个配置版本，每个版本可以运行多次。',['projects','applications','test_tasks','task_revisions']],
['一次运行的可追溯结果','点击实体查看字段、外键与约束。运行和结论分离，重跑不覆盖历史。',['test_runs','run_components','case_results','artifacts']],
['共用资源，保留各端差异','实例引用当前档案，历史运行固定当时档案；人工调试与运行共用租约。',['resource_profiles','execution_resources','debug_sessions','resource_leases']],
['性能口径与历史判定','基线、规则和原始结论均保留版本。后续试算独立保存。',['metric_summaries','baselines','gate_policies','gate_evaluations']]
];return `<div class="db-section panel panel-pad"><div class="between mb"><h2>任务 1 → N 配置版本 1 → N 运行</h2><span class="badge gray">${databaseTables.length} 张设计表</span></div><p class="db-note small muted">项目管理 Web、Android 和 iOS 应用。UI 自动化和性能是测试类型；执行器通过适配器接入。下面按业务链路阅读，并非每个相邻框都表示直接外键；字段字典提供准确关联。</p></div>${lanes.map(([title,note,names])=>`<section class="db-section"><h3>${title}</h3><p class="small muted" style="margin:5px 0 12px">${note}</p><div class="db-entities">${names.map(name=>{const t=databaseTables.find(t=>t.name===name);return `<button class="db-entity" data-action="db-table" data-value="${name}"><strong>${t.title}</strong><code>${t.name}</code><small>${t.purpose}</small></button>`}).join('')}</div></section>`).join('')}<div class="db-storage"><section class="panel panel-pad"><h3>关系库存结构与摘要</h3><p class="small muted mt">配置、版本、关联、状态、用例结果、指标摘要和审计。公共查询字段使用显式列，端侧配置使用带版本的 JSONB。</p></section><section class="panel panel-pad"><h3>文件存储保留完整现场</h3><p class="small muted mt">截图、UI 树、录像、trace、日志和性能曲线单独归档。数据库记录私有存储键、摘要和可用状态。</p></section></div><p class="small muted mt">建表不等于接入完成：后端还须落实权限、状态转换、配置校验、Agent token 检查与文件对账。</p>`}
function databaseDictionaryPage(){return `<div class="toolbar"><div class="search">${icon('search')}<input id="db-search" aria-label="搜索数据表或字段" placeholder="搜索表名、中文名称或字段" value="${esc(dbQuery)}"></div><select class="db-filter" id="db-group" aria-label="数据领域"><option value="all">全部领域</option>${[...new Set(databaseTables.map(t=>t.group))].map(g=>`<option ${g===dbGroup?'selected':''}>${g}</option>`).join('')}</select><span class="spacer"></span><span class="small muted">列、键与 schema.sql 对应</span></div><div id="db-dictionary">${databaseDictionary()}</div>`}
function databaseDictionary(){const q=dbQuery.trim().toLowerCase(),rows=databaseTables.filter(t=>(dbGroup==='all'||t.group===dbGroup)&&[t.name,t.title,t.purpose,...t.fields.map(f=>f.name+' '+f.description)].join(' ').toLowerCase().includes(q));if(!rows.length)return empty('没有匹配的数据表','尝试 task、租约、baseline 或字段名。');const t=rows.find(t=>t.name===dbSelected)||rows[0];dbSelected=t.name;const refs=[...new Set(t.constraints.map(c=>c.match(/REFERENCES (\w+)/)?.[1]).filter(Boolean))];if(t.fields.some(f=>f.definition.includes('REFERENCES projects')))refs.unshift('projects');const children=databaseTables.filter(other=>other.constraints.some(c=>c.includes('REFERENCES '+t.name+'('))||other.fields.some(f=>f.definition.includes('REFERENCES '+t.name+'(')));return `<div class="db-layout"><aside class="panel db-table-list" aria-label="数据表清单"><p class="small muted" style="padding:8px 12px">${rows.length} 张匹配表</p>${rows.map(row=>`<button class="db-table-btn" data-action="db-select" data-value="${row.name}" aria-pressed="${row.name===t.name}"><strong>${row.title}</strong><code>${row.name}</code></button>`).join('')}</aside><section class="panel" aria-label="表结构详情"><div class="panel-head"><div><h2>${t.title}</h2><code class="small text-blue">${t.name}</code></div><span class="badge gray">${t.group}</span></div><div class="panel-pad"><p class="small db-note">${t.purpose}</p><div class="db-relations mt">${refs.length?'<span class="small muted">引用</span>'+[...new Set(refs)].map(dbLink).join(''):'<span class="small muted">根实体，无父表引用</span>'}</div>${children.length?`<div class="db-relations mt"><span class="small muted">被引用</span>${children.map(c=>dbLink(c.name)).join('')}</div>`:''}</div><div class="table-wrap"><table class="task-table db-field-table"><thead><tr><th>字段</th><th>SQL 定义</th><th>说明</th></tr></thead><tbody>${t.fields.map(f=>`<tr><td>${esc(f.name)}</td><td><code>${esc(f.definition.slice(f.name.length).trim())}</code></td><td class="small">${esc(f.description)}</td></tr>`).join('')}</tbody></table></div><div class="panel-pad"><h3>表级约束</h3><ul class="db-constraints mt">${t.constraints.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>${t.notes?`<div class="notice mt">${esc(t.notes)}</div>`:''}<p class="small muted mt">主键与列内约束见上表，额外查询索引见 SQL。关联完整性由数据库约束，业务权限与状态转换由后端实现。</p></div></section></div>`}
function databaseFlowPage(){const flow=databaseFlows[dbFlow];return `<div class="toolbar"><label class="field"><span>选择业务流程</span><select id="db-flow" aria-label="选择写入流程">${Object.entries(databaseFlows).map(([key,f])=>`<option value="${key}" ${key===dbFlow?'selected':''}>${f.title}</option>`).join('')}</select></label><span class="spacer"></span><span class="badge amber">设计说明，不执行 SQL</span></div><section class="panel panel-pad"><h2>${flow.title}</h2>${flow.steps.map(([title,description,names],i)=>`<div class="db-step"><div class="db-step-number">${i+1}</div><div><h3>${title}</h3><p class="small muted db-note" style="margin:7px 0 12px">${description}</p><div class="db-relations">${names.map(dbLink).join('')}</div></div></div>`).join('')}</section><div class="notice blue mt">本页描述事务与数据去向，不能代替真实并发测试。完整状态机、权限、保留策略和验收用例见设计文档。</div>`}

const navItems=[['overview','grid','工作台'],['apps','layers','项目与应用'],['ui','phone','UI 自动化'],['perf','pulse','性能测试'],['devices','devices','执行资源'],['tasks','tasks','任务中心'],['reports','report','报告中心'],['integration','plug','接入说明'],['database','layers','数据设计']];
function navigation(){return navItems.map(([id,ic,title],i)=>`${i===2?'<div class="nav-label">测试能力</div>':i===4?'<div class="nav-label">共享资源</div>':i===7?'<div class="nav-label">设计依据</div>':''}<a class="nav-link ${route===id?'active':''}" href="#${id}" ${route===id?'aria-current="page"':''}>${icon(ic)}<span>${title}</span>${id==='tasks'&&count('running')?`<span class="nav-count">${count('running')}</span>`:''}</a>`).join('')}
function render(){route=navItems.some(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):'overview';$('#navigation').innerHTML=navigation();$('#breadcrumb').textContent=navItems.find(n=>n[0]===route)[2];$('#main').innerHTML=context()+({overview:overviewPage,apps:appsPage,ui:()=>['web','ios'].includes(targetScope)?plannedCapabilityPage('ui'):uiPage(),perf:()=>['web','ios'].includes(targetScope)?plannedCapabilityPage('perf'):perfPage(),devices:devicesPage,tasks:tasksPage,reports:reportsPage,integration:integrationPage,database:databasePage})[route]();document.title=navItems.find(n=>n[0]===route)[2]+' · TestDock';$('#sidebar').classList.remove('open');$('#sidebar-overlay').classList.remove('open')}
function go(page){if(route===page)render();else location.hash=page}

function targetPicker(active){return `<div class="field mb"><span>目标端</span><div class="target-picker">${Object.entries(targetCatalog).map(([k,p])=>`<button class="btn ${k===active?'soft':''}" data-action="wizard-platform" data-value="${k}" aria-pressed="${k===active}" ${wizard?.editId&&k!==active?'disabled':''}>${p.label}<span class="small muted">${k==='android'?'组件基础':'规划中'}</span></button>`).join('')}</div></div>`}
function targetOverview(){return `<div class="target-overview mb">${Object.entries(targetCatalog).map(([k,p])=>`<button class="target-card ${targetScope===k?'selected':''}" data-action="target-scope" data-value="${k}"><div class="between"><strong>${p.label}</strong><span class="badge ${k==='android'?'blue':'gray'}">${p.capability}</span></div><p>${p.application} / ${p.resource}</p><span class="small muted">${k==='android'?'UI 与性能交互可体验':'可配置草稿，执行服务待接入'}</span></button>`).join('')}</div>`}
function appsPage(){return heading('项目与应用','一个产品项目下分别管理 Web、Android 和 iOS 应用，共用任务与报告入口。')+targetOverview()+`<section class="panel panel-pad"><h2>星河产品</h2><p class="muted small mt">测试环境：staging · 当前为演示项目，未来可按项目隔离应用、配置与执行权限。</p><div class="table-wrap mt"><table class="task-table"><thead><tr><th>目标端</th><th>应用</th><th>目标标识</th><th>执行能力</th><th>操作</th></tr></thead><tbody>${Object.entries(targetCatalog).filter(([k])=>targetScope==='all'||targetScope===k).map(([k,p])=>`<tr><td>${p.label}</td><td>${p.application}</td><td class="mono">${esc(p.identifier)}</td><td>${k==='android'?'已有组件，平台未连接':'规划中'}</td><td><button class="link-btn" data-action="open-target" data-value="${k}" data-page="ui">进入应用工作区</button></td></tr>`).join('')}</tbody></table></div></section><div class="notice blue mt">应用标识按目标端区分：Android 包名、iOS Bundle ID、Web 站点地址。任务绑定明确的应用与环境，跨端只汇总共同结果，不混用性能基线。</div>`}
function plannedOverview(){const p=targetCatalog[targetScope];return heading('测试工作台',p.application+' · 提前组织测试配置，执行服务接入后再运行。',btn(icon('plus')+' 新建配置草稿','new','','primary'))+targetOverview()+`<div class="notice blue mb">当前目标端为 ${p.label}，尚无执行器。下面仅显示该端的配置草稿，不混入 Android 的运行、设备或性能结果。</div><div class="modules"><section class="panel panel-pad"><h2>UI 自动化</h2><p class="small muted mt">${targetScope==='web'?'页面、交互与浏览器兼容性':'应用流程、元素定位与设备兼容性'} · 规划中</p><div class="mt">${btn('查看能力规划','nav','data-page="ui"','small')}</div></section><section class="panel panel-pad"><h2>性能测试</h2><p class="small muted mt">${targetScope==='web'?'页面时序、资源与体验指标':'应用资源、流畅度与启动场景'} · 规划中</p><div class="mt">${btn('查看能力规划','nav','data-page="perf"','small')}</div></section></div><section class="panel"><div class="panel-head"><h2>${p.label} 配置草稿</h2><span class="small muted">${count('draft')} 个草稿 / 0 次执行</span></div>${scopedTasks().length?taskTable(scopedTasks(),true):empty('尚无配置草稿','可以先填写应用、测试类型与执行环境。')}</section>`}
function plannedCapabilityPage(type){const p=targetCatalog[targetScope],web=targetScope==='web';const capabilities=type==='ui'?(web?['页面与交互断言','元素调试与定位','浏览器兼容性矩阵','失败截图与执行追踪']:['应用流程与断言','原生元素定位','真机 / 模拟器矩阵','失败现场与执行追踪']):(web?['页面加载与导航时序','资源请求与体积','用户体验指标','按浏览器环境建立基线']:['应用资源与内存','帧率与交互流畅度','启动场景耗时','按设备与系统档案建立基线']);return heading(type==='ui'?'UI 自动化':'性能测试',p.application+' · 能力规划',btn(icon('plus')+' 新建配置草稿','new','data-module="'+type+'"','primary'))+`<div class="notice mb">${icon('plug')}<div><strong>${p.label} 执行能力待接入</strong><br>可以预先保存配置草稿；当前不运行任务、不生成测试结论。${type==='perf'?'指标可用性、统计口径与阈值须在适配器接入时验证。':''}</div></div><div class="integration-grid"><section class="panel panel-pad"><h2>计划支持的工作流程</h2><div class="timeline">${capabilities.map(c=>`<div class="timeline-item"><p>${c}</p><small>规划能力 / 尚未接入</small></div>`).join('')}</div></section><section class="panel panel-pad"><h2>目标与执行环境</h2><dl class="kv mt"><dt>目标端</dt><dd>${p.label}</dd><dt>应用</dt><dd>${p.application}</dd><dt>目标标识</dt><dd>${esc(p.identifier)}</dd><dt>执行资源</dt><dd>${p.resource}</dd><dt>平台共用</dt><dd>任务、环境、报告、证据归属</dd><dt>端侧独立</dt><dd>执行适配器、定位 / 指标、基线口径</dd></dl><div class="mt">${btn('查看执行资源','nav','data-page="devices"','small')}</div></section></div>`}
function devicesPage(){if(targetScope==='android')return androidDevicesPage();if(targetScope==='all')return targetOverview()+androidDevicesPage();const web=targetScope==='web';return heading('执行资源',web?'浏览器环境 · 按浏览器内核、版本、系统与视口定义配置。':'移动设备 · iOS 真机与模拟器资源规划。')+`<div class="notice blue mb">以下是待接入的环境配置模板，不代表存在可连接的设备或运行节点。</div><div class="resource-grid">${(web?['Chromium','Firefox','WebKit']:['iPhone 真机','iPad 真机','iOS 模拟器']).map(name=>`<section class="panel panel-pad"><div class="between"><h3>${name}</h3><span class="badge gray">待接入</span></div><dl class="kv mt"><dt>资源类型</dt><dd>${web?'浏览器环境配置':'设备需求模板'}</dd><dt>${web?'浏览器版本':'系统版本'}</dt><dd>接入时固定</dd><dt>${web?'视口配置':'设备档案'}</dt><dd>${web?'可在任务草稿配置':'按型号与系统版本隔离'}</dd><dt>可用实例</dt><dd>0</dd></dl>${btn('创建配置草稿','new','data-module="ui"','small')}</section>`).join('')}</div><p class="small muted mt">${web?'WebKit 是浏览器内核配置，不代表已提供 Safari 或 iOS 真机兼容性验证。':'iOS 的执行节点与设备权限需单独设计，不沿用 Android ADB 接入。'}</p>`}
function architectureNote(){return `<section class="panel panel-pad mb"><h2>平台通用模型</h2><div class="flow-box mt"><span class="flow-node">项目</span>${icon('arrow')}<span class="flow-node">应用 / 目标端</span>${icon('arrow')}<span class="flow-node">测试类型 + 环境</span>${icon('arrow')}<span class="flow-node">执行资源 / 适配器</span>${icon('arrow')}<span class="flow-node">任务 → 运行 → 报告</span></div><p class="small muted mt">Android、iOS、Web 是目标端；UI 自动化、性能测试是测试类型。移动设备与浏览器环境都是执行资源。原有 mobile-auto / mobile_perf 作为 Android 适配器基础，平台核心不直接依赖它们的设备协议。</p><p class="small muted mt">统一汇总运行状态与 passed / failed / not_tested。各端指标与证据保持自己的类型；配置草稿未执行，不计入运行通过率，也不等同于 not_tested。</p></section>`}
function setWizardPlatform(value){wizard.platform=value;wizard.pkg=targetCatalog[value].identifier;wizard.step=1;if(value!=='android'&&wizard.module==='joint')wizard.module='ui'}
function plannedWizard(){const w=wizard,p=targetCatalog[w.platform],web=w.platform==='web';let body='';
 if(w.step===1)body=targetPicker(w.platform)+`<div class="module-options" style="grid-template-columns:1fr 1fr">${[['ui','UI 自动化'],['perf','性能测试']].map(([id,label])=>`<button class="module-option ${w.module===id?'active':''}" data-action="wizard-module" data-value="${id}" aria-pressed="${w.module===id}"><strong>${label}</strong><p>规划中 / 可保存配置</p></button>`).join('')}</div><div class="form-grid"><label class="field full"><span>任务名称 *</span><input id="w-name" aria-label="任务名称" value="${esc(w.name)}" maxlength="60" required></label><label class="field full"><span>${web?'站点地址':'Bundle ID'} *</span><input id="w-pkg" aria-label="目标标识" value="${esc(w.pkg)}" maxlength="200" required></label><label class="field"><span>版本 / 构建 *</span><input id="w-build" value="${esc(w.build)}" maxlength="40" required></label><label class="field"><span>测试环境</span><select id="w-environment" aria-label="测试环境"><option value="staging" ${w.environment==='staging'?'selected':''}>staging / 预发布</option><option value="qa" ${w.environment==='qa'?'selected':''}>qa / 测试</option></select></label><label class="field full"><span>测试套件 / 场景 *</span><input id="w-suite" aria-label="测试套件或场景" value="${esc(w.suite)}" maxlength="80" required></label></div>`;
 if(w.step===2)body=`<div class="notice blue mb">配置环境需求，不预订或连接真实资源。${p.label} 执行适配器尚未接入。</div><div class="form-grid">${web?`<label class="field"><span>浏览器内核</span><select id="w-browser" aria-label="浏览器内核">${['Chromium','Firefox','WebKit'].map(b=>`<option ${w.browser===b?'selected':''}>${b}</option>`).join('')}</select></label><label class="field"><span>视口</span><select id="w-viewport" aria-label="视口">${['1440 × 900','1920 × 1080','390 × 844'].map(v=>`<option ${w.viewport===v?'selected':''}>${v}</option>`).join('')}</select></label>`:`<label class="field full"><span>设备需求</span><select id="w-iosResource" aria-label="iOS 设备需求">${['iPhone 设备（待接入）','iPad 设备（待接入）','iOS 模拟器（待接入）'].map(d=>`<option ${w.iosResource===d?'selected':''}>${d}</option>`).join('')}</select></label>`}</div><div class="summary-block mt"><strong>${w.module==='ui'?'结果与证据规划':'性能口径规划'}</strong><p class="small muted mt">${w.module==='ui'?'测试步骤、断言、截图与执行日志；具体证据种类取决于后续适配器。':web?'导航时序、页面资源与体验指标；不套用 Android 的 PSS / FPS 阈值。':'按 iOS 采集能力定义指标与基线；不直接套用 SoloPi 或 Android 统计口径。'}</p></div><p class="small muted">浏览器 / 系统版本与执行节点在接入阶段固定，当前仅预留配置。</p>`;
 if(w.step===3)body=`<div class="notice mb">保存为配置草稿。执行能力尚未接入，不会排队或产生通过 / 失败结果。</div><div class="summary-block"><dl class="kv"><dt>目标端</dt><dd>${p.label}</dd><dt>应用</dt><dd>${p.application}</dd><dt>任务名称</dt><dd>${esc(w.name)}</dd><dt>测试类型</dt><dd>${moduleNames[w.module]}</dd><dt>目标标识</dt><dd>${esc(w.pkg)}</dd><dt>环境</dt><dd>${esc(w.environment)}</dd><dt>执行配置</dt><dd>${web?esc(w.browser+' / '+w.viewport):esc(w.iosResource)}</dd><dt>状态</dt><dd>配置草稿 / 待接入</dd></dl></div>`;

an><select id="image-outcome"><option value="present" ${imageOutcome==='present'?'selected':''}>目标存在，模拟分数 0.96</option><option value="absent" ${imageOutcome==='absent'?'selected':''}>目标未出现，模拟分数 0.42</option></select></label>${btn('模拟采集新画面并重新匹配','image-match',!ready||!t||!valid?'disabled':'','primary')}<div class="image-status small" role="status">${imageResult?`<strong class="${imageResult.matched?'text-green':'text-red'}">${imageResult.matched?'模拟匹配成功：1 个区域':'模拟匹配失败：0 个区域'}</strong><br>分数 ${imageResult.score.toFixed(2)} / 阈值 ${Number(imageThreshold).toFixed(2)}<br>验证快照 SNAP-IMAGE-${imageSnapshot}，已作为新的冻结底图。${imageResult.matched?'<br>区域 [X, Y, 宽度, 高度]：['+imageRegion.join(', ')+']':'<br>降低阈值或更换模板后重试。'}`:'尚未验证。修改模板、选区或阈值后需重新验证。'}</div><pre class="code-block" id="locator-expression">${t&&valid?esc(imageExpression()):'选择模板并填写有效阈值后生成 IMAGE 表达式'}</pre>${btn('复制 IMAGE 表达式','copy-locator',!t||!valid?'disabled':'','small')}<p class="small muted">表达式按逻辑名解析模板。此处可选择历史版本查看，复制不锁定版本；正式运行以模板清单为准。</p></section>`}
function imageCrop(region){const [w,h]=imageSize(),[x,y,rw,rh]=region,scale=Math.min(200/(214*rw/w),105/(558*rh/h));return `<div style="transform:scale(${scale});transform-origin:top left;position:absolute;left:0;top:0"><div style="position:relative;width:${214*rw/w}px;height:${558*rh/h}px;overflow:hidden"><div class="image-stage" style="position:absolute;margin:0;left:${-6-214*x/w}px;top:${-6-558*y/h}px">${phoneMarkup(false)}</div></div></div>`}
function imageRegionFits(r){const [w,h]=imageSize();return Array.isArray(r)&&r.length===4&&r.every(Number.isInteger)&&r[0]>=0&&r[1]>=0&&r[2]>=4&&r[3]>=4&&r[0]+r[2]<=w&&r[1]+r[3]<=h}
function imageApplyRegion(region){const [w,h]=imageSize();if(!imageRegionFits(region)){toast('选区至少为 4 × 4 像素，且必须在画面内。');return false}imageRegion=region;clearImage();render();return true}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 if(a==='inspect-mode'){inspectMode=el.dataset.value;clearImage();render()}
 if(a==='image-region'&&imageReady())imageApplyRegion([0,1,2,3].map(i=>Number($('#image-coord-'+i).value)));
 if(a==='image-save'&&imageReady()&&imageRegion){if(!imageRegionFits(imageRegion)){toast('选区已超出当前设备，请重新框选。');return}if(!/^[a-zA-Z0-9_./-]+$/.test(imageName)||!imageValidThreshold()){toast('填写有效模板名和 0.10 至 1.00 的阈值。');return}const version=Math.max(0,...templates.filter(t=>t.name===imageName).map(t=>t.version))+1;templates.push({name:imageName,version,confidence:Number(imageThreshold),region:[...imageRegion],device:getDevice(inspectorDevice).name,snapshot:'SNAP-IMAGE-'+imageSnapshot,sourceSize:imageSize()});imageTemplate=templates.length-1;clearImage();save();render();toast('已保存演示模板 v'+version+'，模板库已同步。')}

 if(a==='freeze'||a==='inspect-device'){clearImage(true);imageSnapshot++;}
},true);
document.addEventListener('input',e=>{if(e.target.id==='image-name')imageName=e.target.value;if(e.target.id==='image-threshold'){imageThreshold=e.target.value;clearImage();const valid=imageValidThreshold();$('#image-threshold-error').textContent=valid?'':'请输入 0.10 至 1.00 之间的数字。';$('.image-status').textContent='阈值已更改，请重新验证。';$('#locator-expression').textContent=templates[imageTemplate]&&valid?imageExpression():'选择模板并填写有效阈值后生成 IMAGE 表达式';$('[data-action="image-match"]').disabled=!imageReady()||!templates[imageTemplate]||!valid;$('.image-form [data-action="copy-locator"]').disabled=!templates[imageTemplate]||!valid;if($('#image-selection'))$('#image-selection').innerHTML=imageBox();}});
document.addEventListener('change',e=>{if(e.target.id==='image-template'){imageTemplate=Number(e.target.value);const t=templates[imageTemplate];const compatible=t?.sourceSize?JSON.stringify(t.sourceSize)===JSON.stringify(imageSize()):!t?.region||imageRegionFits(t.region);imageRegion=compatible&&imageRegionFits(t?.region)?[...t.region]:null;if(t?.region&&!compatible)toast('模板来源尺寸不同，已清除选区；请在当前设备重新框选。');if(t){imageName=t.name;imageThreshold=String(t.confidence)}clearImage();render()}if(e.target.id==='image-outcome'){imageOutcome=e.target.value;clearImage();render()}if(e.target.id==='inspect-device'){clearImage(true);imageSnapshot++;}} ,true);
let imageDrag=null;
document.addEventListener('pointerdown',e=>{if(e.target.id!=='image-selection'||!imageReady())return;const box=e.target.getBoundingClientRect(),[w,h]=imageSize();imageDrag={el:e.target,box,w,h,x:Math.round((e.clientX-box.left)/box.width*w),y:Math.round((e.clientY-box.top)/box.height*h)};e.target.setPointerCapture(e.pointerId);e.preventDefault()});
function dragRegion(e){const d=imageDrag,x=Math.max(0,Math.min(d.w,Math.round((e.clientX-d.box.left)/d.box.width*d.w))),y=Math.max(0,Math.min(d.h,Math.round((e.clientY-d.box.top)/d.box.height*d.h)));return [Math.min(x,d.x),Math.min(y,d.y),Math.abs(x-d.x),Math.abs(y-d.y)]}

function perfVerdict(){const t=getTask(selectedRun)||getTask('1047');if(baselineProfile!=='same')return {status:'not_tested',reason:'基线设备档案不匹配。请选择同机型、同系统大版本的基线。',checks:[]};if(sampleMode==='low'||t?.status==='not_tested')return {status:'not_tested',reason:'有效样本数为 6，低于默认下限 10；本次不作通过或失败判断。',checks:[]};const checks=['memory','cpu','fps'].map(k=>{const m=metricForRun(t,k),threshold=rules[k],ok=k==='fps'?m.median>=threshold:m.median<threshold;return {key:k,name:m.name,value:m.median,threshold,unit:m.unit,ok,level:k==='cpu'?rules.cpuLevel:'fail',op:k==='fps'?'≥':'<',sampleCount:180}});const failed=checks.some(c=>!c.ok&&c.level==='fail'),warn=checks.some(c=>!c.ok&&c.level==='warn');return {status:failed?'failed':'passed',reason:failed?'存在阻断级阈值未满足，请查看下方指标明细。':warn?'阻断级阈值均满足；存在告警级超标，结论仍为通过。':'全部配置阈值均满足，采样与设备档案可比。',checks}}

 <section class="panel mt"><div class="panel-head"><h2>质量门禁 · 当前规则试算</h2><button class="link-btn" data-action="perf-tab" data-value="baseline">配置门禁规则</button></div>${v.checks.length?`<div class="table-wrap"><table class="task-table"><thead><tr><th>指标</th><th>中位数</th><th>绝对阈值</th><th>级别</th><th>样本数</th><th>检查结果</th></tr></thead><tbody>${v.checks.map(c=>`<tr><td>${c.name}</td><td>${c.value} ${c.unit}</td><td>${esc(c.op)} ${c.threshold} ${c.unit}</td><td>${c.level==='fail'?'阻断':'告警'}</td><td>${c.sampleCount}</td><td>${badge(c.ok?'passed':c.level==='warn'?'amber':'failed',c.ok?'满足阈值':c.level==='warn'?'告警，不阻断':'阈值未满足')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>未判定</strong>${v.reason}</div>`}</section>`)}
function chartMarkup(t,key){const m=metricForRun(t,key);if(m.median===null)return `<div class="empty" style="min-height:260px;display:grid;place-content:center">${icon('pulse')}<strong>当前设备不支持 GPU 占用采集</strong>保留缺失原因，不以 0 代替未采集值。</div>`;const left=45,right=680,top=18,bottom=200,scale=v=>bottom-(v-m.min)/(m.max-m.min)*(bottom-top),n=t.status==='not_tested'||sampleMode==='low'?6:31,amp=key==='memory'?26:key==='cpu'?8:3;const points=Array.from({length:n},(_,i)=>[left+i*(right-left)/(n-1),scale(m.median+Math.sin(i*1.35)*amp+Math.cos(i*.7)*amp*.25)]);const poly=points.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');const base=Array.from({length:31},(_,i)=>[left+i*(right-left)/30,scale(m.baseline+Math.sin(i*.8)*amp*.28)]).map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');return `<div class="chart"><svg viewBox="0 0 700 240" role="img" aria-label="${m.name}演示趋势图，归档窗口 ${t.duration} 秒"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${m.color}" stop-opacity=".13"/><stop offset="100%" stop-color="${m.color}" stop-opacity=".01"/></linearGradient></defs>${Array.from({length:5},(_,i)=>{const y=top+i*(bottom-top)/4,value=m.max-i*(m.max-m.min)/4;return `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#e9edf4" stroke-dasharray="3 4"/><text x="30" y="${y+4}" text-anchor="end">${Math.round(value)}</text>`}).join('')}<polygon points="${left},${bottom} ${poly} ${right},${bottom}" fill="url(#chart-fill)"/>${baselineProfile==='same'?`<polyline points="${base}" fill="none" stroke="#9cb4a9" stroke-width="2" stroke-dasharray="5 4"/>`:''}<polyline points="${poly}" fill="none" stroke="${m.color}" stroke-width="2.5" stroke-linejoin="round"/>${Array.from({length:7},(_,i)=>`<text x="${left+i*(right-left)/6}" y="224" text-anchor="middle">${Math.round((t.duration||180)*i/6)}s</text>`).join('')}<text x="${left}" y="11">${m.unit}</text></svg></div>`}
function baselinePage(){return `<div class="notice blue mb">${icon('flag')}<div>基线按设备档案隔离；阈值由平台传入。当前组件使用 median 与绝对阈值比较，不自动把版本回退百分比当成门禁。</div></div><div class="integration-grid"><section class="panel panel-pad"><h2>3.7.9 稳定版基线</h2><p class="small muted mt">演示基线 / 与选中运行同设备档案</p><dl class="kv mt"><dt>来源运行</dt><dd>BASE-DEMO-379</dd><dt>设备档案</dt><dd>${esc(getDevice((getTask(selectedRun)||getTask('1047')).device).profile)}</dd><dt>PSS 中位数</dt><dd>221 MB</dd><dt>CPU 中位数</dt><dd>22.8%</dd><dt>FPS 中位数</dt><dd>59.1 fps</dd><dt>样本下限</dt><dd>10（组件默认）</dd></dl><div class="notice mt">不同机型或系统大版本不可直接沿用此基线。</div></section><section class="panel panel-pad"><h2>质量门禁阈值</h2><p class="small muted" style="margin:8px 0 13px">保存后用于原型试算，不修改历史报告或真实配置。</p><form id="rules-form"><div class="threshold-grid"><span>指标</span><span>比较</span><span>阈值</span><span>级别</span></div><div class="threshold-grid"><span>PSS 内存<br><code>mem_pss_mb</code></span><span>&lt;</span><input type="number" name="memory" aria-label="PSS 内存阈值" min="1" max="10000" step="1" value="${rules.memory}" required><span>阻断</span></div><div class="threshold-grid"><span>进程 CPU<br><code>cpu_process_pct</code></span><span>&lt;</span><input type="number" name="cpu" aria-label="CPU 阈值" min="0.1" max="1000" step=".1" value="${rules.cpu}" required><select name="cpuLevel" aria-label="CPU 门禁级别"><option value="warn" ${rules.cpuLevel==='warn'?'selected':''}>告警</option><option value="fail" ${rules.cpuLevel==='fail'?'selected':''}>阻断</option></select></div><div class="threshold-grid"><span>帧率<br><code>fps_frame</code></span><span>≥</span><input type="number" name="fps" aria-label="FPS 阈值" min="1" max="240" step=".1" value="${rules.fps}" required><span>阻断</span></div><p class="small muted mt">告警级超标保留 passed；样本不足、缺失指标或基线不可比则返回 not_tested。</p><div class="mt"><button type="submit" class="btn primary">保存演示规则</button></div></form></section></div>`}
function reportsPage(){return heading('报告中心','保留每次运行的原始结论，从结果回到证据。')+`<div class="toolbar"><div class="search">${icon('search')}<input id="report-search" aria-label="搜索报告" placeholder="搜索报告名称或运行编号" value="${esc(reportQuery)}"></div><select id="report-filter" aria-label="报告模块筛选"><option value="all">全部模块</option>${Object.entries(moduleNames).map(([k,v])=>`<option value="${k}" ${reportFilter===k?'selected':''}>${v}</option>`).join('')}</select><span class="spacer"></span><span class="small muted">重跑创建新记录，不覆盖历史证据</span></div><div id="report-results">${reportCards()}</div>`}
function reportCards(){const rows=scopedTasks().filter(t=>isFinished(t)&&(reportFilter==='all'||reportFilter===t.module)&&(t.name+'RUN-'+t.id).toLowerCase().includes(reportQuery.toLowerCase()));return rows.length?`<div class="resource-grid">${rows.map(t=>`<section class="panel report-card"><div class="between"><span class="module-pill">${platformName(t)} / ${moduleNames[t.module]}</span>${badge(t.status)}</div><h3>${esc(t.name)}</h3><p>RUN-${esc(t.id)} / ${esc(resourceLabel(t))}</p><p class="mt">${t.status==='not_tested'?'样本不足，未产生门禁结论':t.module==='ui'?t.status==='failed'?'断言未满足，已保留失败现场':'用例断言通过，执行过程可追溯':t.status==='failed'?'性能阈值未满足，查看指标与基线':'性能门禁通过，指标与基线可比'}</p><footer><span class="small muted">${esc(t.time)}</span><button class="link-btn" data-action="report" data-id="${esc(t.id)}">查看报告 ${icon('arrow')}</button></footer></section>`).join('')}</div>`:empty('没有匹配的报告','已完成且有判定结果的任务会出现在这里。')}

function openModal(body){const d=$('#modal');d.innerHTML=body;if(!d.open)d.showModal()}
function closeModal(){$('#modal').close()}
function closeDrawer(){$('#drawer').close();currentTask=null}
function simpleModal(title,description,body,foot=''){openModal(`<div class="dialog-head"><div><h2 id="modal-title">${title}</h2><p>${description}</p></div>${btn(icon('close'),'close-modal','aria-label="关闭对话框"','icon-only')}</div><div class="dialog-body">${body}</div><div class="dialog-foot">${foot||btn('知道了','close-modal')}</div>`)}
function taskDetail(id){
 const t=getTask(id);if(!t)return;if(t.status==='draft'){plannedTaskDetail(t);return}currentTask=id;const d=getDevice(t.device),active=t.status==='running',queued=t.status==='queued',stage=active?t.progress<40?1:t.progress<85?2:3:isFinished(t)?4:0;
 const labels=['设备准入与环境检查',t.module==='ui'?'执行 pytest 用例':'启动采集会话',t.module==='ui'?'断言与失败证据':t.module==='joint'?'UI 步骤与采集关联（待接入设计）':'采集时间窗','归档与结果判定'];
 const drawer=$('#drawer');drawer.innerHTML=`<div class="dialog-head"><div><h2 id="drawer-title">RUN-${esc(t.id)}</h2><p>${esc(t.name)}</p></div>${btn(icon('close'),'close-drawer','aria-label="关闭任务详情"','icon-only')}</div><div class="dialog-body"><div class="between mb">${badge(t.status)}<span class="badge gray">${platformName(t)} / ${moduleNames[t.module]}</span></div><dl class="kv"><dt>应用版本</dt><dd>${esc(t.build||'3.8.0-rc.2')}</dd><dt>设备</dt><dd>${d.name} / ${d.os}</dd><dt>用例 / 场景</dt><dd>${esc(t.suite)}</dd><dt>采集窗口</dt><dd>${t.module==='ui'?'不采集性能':t.duration+'s'}</dd><dt>创建时间</dt><dd>2026-10-25 ${esc(t.time)}（演示）</dd>${t.parent?`<dt>重新运行自</dt><dd>RUN-${esc(t.parent)}</dd>`:''}</dl><h3 class="mt">执行过程</h3><div class="timeline">${labels.map((label,i)=>`<div class="timeline-item ${i<stage?'done':''} ${t.status==='failed'&&i===3?'error':''}"><p>${label}</p><small>${i<stage?'已完成（演示）':i===stage&&active?'进行中（演示）':t.status==='cancelled'?'已取消':'等待执行'}</small></div>`).join('')}</div>${active?`<div class="between small mb"><span>模拟执行进度</span><b>${t.progress}%</b></div><div class="progress"><span style="width:${t.progress}%"></span></div>`:''}<div class="notice blue mt">演示模式：使用下方按钮推进状态。不会运行脚本、占用真实设备或调用后端。</div>${t.module==='joint'?'<div class="notice mt">联动需要宿主适配与 DeviceGate 调度，当前演示不代表端到端接入已完成。</div>':''}</div><div class="dialog-foot" style="flex-wrap:wrap">${queued?btn('取消任务','cancel-task','data-id="'+t.id+'"')+btn(icon('play')+' 开始演示','start-task','data-id="'+t.id+'"','primary'):active?btn('取消任务','cancel-task','data-id="'+t.id+'"')+btn('模拟失败','fail-task','data-id="'+t.id+'"','danger')+btn(t.progress>=85?'完成演示':'推进演示','advance-task','data-id="'+t.id+'"','primary'):btn('重新运行','rerun','data-id="'+t.id+'"')+(isFinished(t)?btn('查看报告','report','data-id="'+t.id+'"','primary'):'')}</div>`;if(!drawer.open)drawer.showModal()
}
function reportDetail(id){
 const t=getTask(id);if(!t||!isFinished(t))return;if($('#drawer').open)closeDrawer();const perf=taskHasPerf(t),failed=t.status==='failed';
 simpleModal(`RUN-${esc(t.id)} · 测试报告`,esc(t.name)+' / 原始运行结果 / 演示数据',`<div class="report-summary" style="padding:0 0 22px"><span class="verdict-circle" style="background:var(--${failed?'red':t.status==='passed'?'green':'amber'}-light);color:var(--${failed?'red':t.status==='passed'?'green':'amber'})">${icon(t.status==='passed'?'check':'alert')}</span><div><h2>${statusMap[t.status][1]}</h2><p class="small muted">${t.status==='not_tested'?'有效样本不足，未完成性能判定。':failed?perf?'PSS 内存阈值未满足。':'确认页关键元素在等待时间内未出现。':'本次演示运行的检查项全部通过。'}</p></div></div><div class="summary-block"><dl class="kv"><dt>设备档案</dt><dd>${getDevice(t.device).profile}</dd><dt>应用版本</dt><dd>${esc(t.build||'3.8.0-rc.2')}</dd><dt>测试模块</dt><dd>${moduleNames[t.module]}</dd><dt>证据归属</dt><dd>RUN-${esc(t.id)}（演示产物）</dd></dl></div>
 ${perf?`<div class="notice ${t.status==='passed'?'green':t.status==='not_tested'?'':'red'}">${t.status==='not_tested'?'6 个有效样本，低于 10 个下限。缺失不是通过。':failed?'PSS median 268 MB / 门槛 < 240 MB / 180 个样本。':'PSS median 218 MB / 门槛 < 240 MB / 180 个样本。'}</div><h3 class="mt">归档内容</h3><ul class="small muted"><li>指标汇总与时序曲线（演示）</li><li>采集窗口、设备档案与基线引用</li><li>原始门禁结论，与后续试算结果分开保留</li></ul>${t.module==='joint'?'<div class="notice blue">UI 结果：通过。性能结果按本次门禁结论展示。组合编排属于待接入设计。</div>':''}`:failed?`<div class="evidence-layout"><div class="evidence-shot">${phoneMarkup(false)}<p class="small muted" style="font-size:10px">失败画面示意 / 非真实截图</p></div><div><h3>失败证据</h3><pre class="code-block">AssertionError: 确认页关键元素未出现
wait_for: order_confirm
timeout: 10 s
run: RUN-${esc(t.id)}

function newTask(module='ui',suite='核心链路回归'){wizard={step:1,platform:targetScope==='all'?'android':targetScope,environment:'staging',browser:'Chromium',viewport:'1440 × 900',iosResource:'iPhone 设备（待接入）',module,name:module==='perf'?'性能采集':module==='joint'?'UI 与性能联动验证':'UI 回归测试',pkg:'com.example.xinghe',build:'3.8.0-rc.2',suite:module==='perf'?'首页滑动场景':suite,device:devices.find(d=>deviceState(d)==='idle')?.id||'d2',duration:180,items:['CPU','Memory','FPS']};setWizardPlatform(wizard.platform);wizardRender()}
function readDraft(){if(!wizard)return;for(const key of ['name','pkg','build','suite','duration','environment','browser','viewport','iosResource']){const el=$('#w-'+key);if(el)wizard[key]=el.value}const checked=$('input[name="w-device"]:checked');if(checked)wizard.device=checked.value;if($('#w-items'))wizard.items=$$('input[name="w-item"]:checked').map(e=>e.value)}
function wizardRender(){const w=wizard;if(w.platform!=='android'){plannedWizard();return}const isPerf=w.module!=='ui';let body='';
 if(w.step===1)body=targetPicker(w.platform)+`<div class="module-options">${[['ui','phone','UI 自动化','执行 pytest 套件'],['perf','pulse','性能测试','采集指标与门禁'],['joint','layers','UI + 性能','联动设计 / 待接入']].map(([id,ic,title,desc])=>`<button class="module-option ${w.module===id?'active':''}" data-action="wizard-module" data-value="${id}" aria-pressed="${w.module===id}">${icon(ic)}<strong>${title}</strong><p>${desc}</p></button>`).join('')}</div><div class="form-grid"><label class="field full"><span>任务名称 *</span><input id="w-name" value="${esc(w.name)}" maxlength="60" placeholder="给本次测试起一个名字" required></label><label class="field"><span>应用包名 *</span><input id="w-pkg" value="${esc(w.pkg)}" maxlength="120" required></label><label class="field"><span>应用版本 *</span><input id="w-build" value="${esc(w.build)}" maxlength="40" required></label><label class="field full"><span>${w.module==='perf'?'测试场景':'测试套件'}</span><select id="w-suite">${(w.module==='perf'?['首页滑动场景','商品详情','搜索场景']:suites.map(s=>s.name)).map(name=>`<option ${name===w.suite?'selected':''}>${name}</option>`).join('')}</select><small>示例目录；实际用例与应用版本需要宿主同步。</small></label></div>${w.module==='joint'?'<div class="notice mt">本流程演示联动任务配置；真实运行需要宿主注入设备准入协议并实现步骤打标。</div>':''}`;
 if(w.step===2)body=`<h3>选择执行设备</h3><p class="small muted" style="margin:5px 0 13px">可选择占用中的设备排队；离线或未授权设备不可选。</p>${devices.map(d=>{const s=deviceState(d),disabled=['offline','unauthorized'].includes(s);return `<label class="device-choice"><input type="radio" name="w-device" value="${d.id}" ${w.device===d.id?'checked':''} ${disabled?'disabled':''}><span class="grow"><strong>${d.name}</strong><span class="muted small"> / ${d.os}</span></span>${badge(s)}</label>`}).join('')}${isPerf?`<div class="form-grid mt"><label class="field"><span>采集时长（秒）*</span><input id="w-duration" type="number" min="10" max="3600" step="1" value="${w.duration}" required><small>演示范围 10–3600 秒；实际采样率由设备决定。</small></label><div class="field"><span>基线与门禁</span><div class="summary-block" style="padding:8px 10px;margin:0;font-size:11px">同档案稳定版 / 标准门禁<br><span class="muted">PSS &lt; 240 / CPU &lt; 35 / FPS ≥ 50</span></div></div></div><div class="field mt" id="w-items"><span>采集指标（CPU / 内存 / FPS 为标准门禁必选）</span><div class="check-list">${['CPU','Memory','FPS','Network','Battery'].map(item=>`<label><input type="checkbox" name="w-item" value="${item}" ${w.items.includes(item)?'checked':''} ${['CPU','Memory','FPS'].includes(item)?'disabled':''}>${{CPU:'CPU',Memory:'内存',FPS:'帧率',Network:'全局网络',Battery:'电流 / 功率'}[item]}</label>`).join('')}</div></div><div class="notice mt">FPS 采集可能需要设备侧确认。正式执行前应检查无障碍、采集权限与设备档案。</div>`:''}`;

function wizardNext(){readDraft();const w=wizard;if(w.platform!=='android'){plannedWizardNext();return}if(w.step===1){if(!w.name.trim()||!w.pkg.trim()||!w.build.trim()){$('#wizard-error').textContent='请填写任务名称、应用包名和版本。';return}if(!/^[a-zA-Z]\w*(\.[a-zA-Z]\w*)+$/.test(w.pkg)){$('#wizard-error').textContent='请使用合法的应用包名，例如 com.example.xinghe。';return}}if(w.step===2){if(!w.device||['offline','unauthorized'].includes(deviceState(getDevice(w.device)))){$('#wizard-error').textContent='请选择已授权在线的设备。';return}if(w.module!=='ui'&&(!Number.isInteger(Number(w.duration))||w.duration<10||w.duration>3600)){$('#wizard-error').textContent='采集时长需要是 10–3600 之间的整数秒。';return}}w.step++;wizardRender()}
function createDemoTask(){readDraft();if(wizard.platform!=='android'){savePlannedTask();return}const w=wizard,id=String(Math.max(...tasks.map(t=>Number(t.id)||0))+1);const t={id,platform:'android',projectId:'xinghe',applicationId:'xinghe-android',environmentId:w.environment||'staging',resourceId:w.device,name:w.name.trim(),module:w.module,status:'queued',device:w.device,suite:w.suite,progress:0,time:new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}),duration:Number(w.duration),pkg:w.pkg,build:w.build,items:w.items};tasks.unshift(t);save();closeModal();targetScope='android';taskFilter='all';taskModule='all';taskQuery='';go('tasks');taskDetail(t.id);toast('演示任务已创建，可点击「开始演示」。')}
function mutateTask(id,action){const t=getTask(id);if(!t||platformOf(t)!=='android')return;if(action==='start-task'&&t.status==='queued'){if(deviceState(getDevice(t.device))!=='idle'){toast('设备仍被其他演示任务占用，请先完成该任务。');return}t.status='running';t.progress=20}else if(action==='advance-task'&&t.status==='running'){t.progress=t.progress<40?55:t.progress<85?90:100;if(t.progress===100)t.status='passed'}else if(action==='fail-task'&&t.status==='running'){t.progress=100;t.status='failed'}else if(action==='cancel-task'&&['queued','running'].includes(t.status)){t.status='cancelled'}else return;save();render();taskDetail(t.id)}
function rerun(id){const t=getTask(id);if(!t||platformOf(t)!=='android')return;const copy={...t,id:String(Math.max(...tasks.map(t=>Number(t.id)||0))+1),name:t.name+' · 重跑',parent:t.id,status:'queued',progress:0,time:new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false})};tasks.unshift(copy);save();closeModal();targetScope='android';if($('#drawer').open)closeDrawer();taskFilter='all';taskQuery='';taskModule='all';go('tasks');taskDetail(copy.id);toast('已创建新的演示运行，原报告保留。')}
function exportReport(id){const t=getTask(id);if(!t||!isFinished(t))return;const perf=taskHasPerf(t),summary={};if(perf)for(const k of ['memory','cpu','fps']){const m=metricForRun(t,k);summary[m.key]={median:m.median,unit:m.unit,sampleCount:t.status==='not_tested'?6:180,source:'synthetic_demo'}}const report={prototype:true,notice:'演示数据，未执行真实测试；平台导出示意，不是组件原始接口响应',runId:'RUN-'+t.id,hostRunId:'RUN-'+t.id,name:t.name,projectId:t.projectId||'xinghe',applicationId:t.applicationId||'xinghe-android',platform:platformOf(t),environmentId:t.environmentId||'staging',resourceId:t.resourceId||t.device,module:t.module,status:t.status,target:t.pkg||'com.example.xinghe',deviceProfile:getDevice(t.device).profile,durationS:t.duration,metricsSummary:perf?summary:null,verdict:t.status,thresholdsAtRun:perf?{mem_pss_mb:['lt',240,'fail'],cpu_process_pct:['lt',35,'warn'],fps_frame:['ge',50,'fail']}:null,reason:t.status==='not_tested'?'sample_count_below_minimum':null};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TestDock-RUN-'+t.id+'-DEMO.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示报告 JSON。')}
